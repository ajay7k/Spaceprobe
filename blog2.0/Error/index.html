<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Space Under Construction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-purple">
    
    <div class="stars">
        <!-- Navigation -->
        <div class="custom-navbar">
            <div class="brand-logo">
                <img src="/img/logo.png" width="200px" alt="Logo">
            </div>
            <div class="navbar-links">
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/about">About</a></li>
                    <li><a href="/features">Features</a></li>
                    <li><a href="/demo" class="btn-request">Request A Demo</a></li>
                </ul>
            </div>
        </div>

        <!-- Central Content -->
        <div class="central-body">
            <img class="image-404" src="http://salehriaz.com/404Page/img/404.svg" width="300px" alt="404">
            <h1 class="construction-title">UNDER CONSTRUCTION</h1>
            <p class="construction-text">Houston, this page is still being built in orbit!</p>
            <a href="/" class="btn-go-home">RETURN TO BASE</a>
        </div>

        <!-- Space Objects -->
        <div class="objects">
            <!-- Original Elements -->
            <img class="object_rocket interactive-object" src="http://salehriaz.com/404Page/img/rocket.svg" width="40px" alt="Rocket" data-speed="3">
            
            <div class="earth-moon">
                <img class="object_earth interactive-object" src="http://salehriaz.com/404Page/img/earth.svg" width="100px" alt="Earth" data-speed="1">
                <img class="object_moon interactive-object" src="http://salehriaz.com/404Page/img/moon.svg" width="80px" alt="Moon" data-speed="1.5">
            </div>
            
            <!-- Main Astronaut -->
            <div class="box_astronaut">
                <img class="object_astronaut interactive-object" src="http://salehriaz.com/404Page/img/astronaut.svg" width="140px" alt="Astronaut" data-speed="2">
            </div>

            <!-- Construction Worker Astronaut -->
            <div class="box_worker">
                <img src="img/astronaut-worker.svg" height = '500px' width="-500px" alt="Construction Worker" class="worker-astronaut interactive-object" data-speed="5">
            </div>

            <!-- Space Station Under Construction -->
            <div class="space-station">
                <img src="img/space-station.svg" width="500px" alt="Space Station" class="station-construct interactive-object" data-speed="1.5">
            </div>

            <!-- Space Crane -->
            <div class="space-crane">
                <img src="img/space-crane.svg" width="350px" alt="Space Crane" class="crane-svg interactive-object" data-speed="2">
            </div>

            <!-- Floating Tools -->
            <!-- <div class="floating-wrench">
                <img src="img/wrench.svg" width="60px" alt="Space Wrench" class="tool-float interactive-object" data-speed="4">
            </div> -->

            <!-- <div class="floating-drill">
                <img src="img/drill.svg" width="70px" alt="Space Drill" class="tool-float-2 interactive-object" data-speed="3.5">
            </div> -->

            <!-- <div class="floating-welding">
                <img src="img/welding-tool.svg" width="80px" alt="Welding Tool" class="tool-weld interactive-object" data-speed="3">
            </div> -->

            <!-- Toolbox -->
            <!-- <div class="floating-toolbox">
                <img src="img/toolbox.svg" width="100px" alt="Toolbox" class="toolbox-float interactive-object" data-speed="2">
            </div> -->

            <!-- Satellite Parts -->
            <!-- <div class="satellite-parts">
                <img src="img/satelliteparts.svg" width="150px" alt="Satellite Parts" class="parts-float interactive-object" data-speed="2.5">
            </div> -->

            <!-- Construction Signs -->
            <div class="construction-sign sign-1">
                <img src="img/construction-sign.svg" width="800px" alt="Construction Sign" class="interactive-object" data-speed="3">
            </div>

            <div class="construction-sign sign-2">
                <img src="img/construction-sign.svg" width="800px" alt="Construction Sign" class="interactive-object" data-speed="3">
            </div>

            <!-- Floating Helmet with Hard Hat -->
            <!-- <div class="floating-helmet">
                <img src="img/Helmet.svg" width="90px" alt="Helmet with Hard Hat" class="helmet-float interactive-object" data-speed="3.5">
            </div> -->

            <!-- Blueprint Tablet -->
            <!-- <div class="blueprint-tablet">
                <img src="img/blueprint-tablet.svg" width="70px" alt="Blueprint Tablet" class="tablet-float interactive-object" data-speed="4">
            </div> -->

            <!-- Construction Barriers (CSS) -->
            <div class="construction-barrier barrier-1 interactive-barrier" data-speed="2"></div>
            <div class="construction-barrier barrier-2 interactive-barrier" data-speed="2"></div>

            <!-- Traffic Cones (CSS) -->
            <div class="traffic-cone cone-1 interactive-object" data-speed="3"></div>
            <div class="traffic-cone cone-2 interactive-object" data-speed="3"></div>
            <div class="traffic-cone cone-3 interactive-object" data-speed="3"></div>

            <!-- Welding Sparks Effect -->
            <div class="sparks-container"></div>

            <!-- Warning Lights (CSS) -->
            <div class="warning-light light-1"></div>
            <div class="warning-light light-2"></div>
        </div>

        <!-- Glowing Stars -->
        <div class="glowing_stars">
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
            <div class="star"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
